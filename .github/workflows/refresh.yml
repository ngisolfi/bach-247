# Refreshes the catalogue from YouTube every week, rebuilds index.html and publishes the site.
# Also publishes on every push to main, and can be run by hand from the Actions tab.
name: Refresh catalogue and publish

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC: weekly refresh
    - cron: "41 10 15 * *" # 15th of each month: backup run in case a weekly run is skipped
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # commit the refreshed catalogue
  pages: write      # publish to GitHub Pages
  id-token: write   # required by deploy-pages
  actions: write    # keep this scheduled workflow enabled

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch playlists from YouTube
        if: github.event_name != 'push'
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 scripts/fetch_playlists.py data/playlists.json

      - name: Build index.html
        if: hashFiles('data/playlists.json') != ''
        run: python3 scripts/build.py data/playlists.json template.html index.html

      - name: Commit if the catalogue changed
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/playlists.json index.html
          if git diff --cached --quiet; then
            echo "No changes this week."
          else
            git commit -m "Refresh catalogue ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html manifest.json apple-touch-icon.png icon-192.png icon-512.png _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # Re-enabling the workflow on every run resets that clock, so it never pauses.
      - name: Keep the schedule alive
        if: always() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable refresh.yml --repo "${{ github.repository }}"
